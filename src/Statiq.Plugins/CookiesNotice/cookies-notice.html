<style>
#cookie-notice {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background-color: #fff;
    border-top: 1px solid #dee2e6;
    padding: 1rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 9999;
}
#cookie-notice p {
    margin: 0;
}
#cookie-notice-accept {
    background-color: #6c757d;
    color: #fff;
    border: none;
    border-radius: 0.25rem;
    padding: 0.375rem 0.75rem;
    cursor: pointer;
    white-space: nowrap;
    margin-left: 1rem;
}
#cookie-notice-accept:hover {
    background-color: #5a6268;
}
</style>
<div id="cookie-notice" style="display:none;">
    <p>{{COOKIE_MESSAGE}}</p>
    <button id="cookie-notice-accept">{{COOKIE_BUTTON_TEXT}}</button>
</div>
<script src="https://cdn.jsdelivr.net/gh/madmurphy/cookies.js@1.0.0/cookies.min.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
    var notice = document.getElementById('cookie-notice');
    var btn = document.getElementById('cookie-notice-accept');
    if (notice && btn) {
        if (!docCookies.hasItem('{{COOKIE_NAME}}')) {
            notice.style.display = 'flex';
        }
        btn.addEventListener('click', function () {
            docCookies.setItem('{{COOKIE_NAME}}', 'true', Infinity);
            notice.style.display = 'none';
        });
    }
});
</script>
